name: Pipeline CI/CD

# 4.1: Se dispara con push y pull_request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # 4.2: Job pruebas
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  # 4.3: Job calidad (corre en paralelo por no tener 'needs')
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de seguridad
        run: npm audit --audit-level=critical

  # 4.4: Job imagen dependiente de pruebas y calidad
  imagen:
    runs-on: ubuntu-latest
    needs: [pruebas, calidad]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Ninguna credencial escrita en texto plano

      - name: Construir y publicar imagen Docker
        # Usamos bash para asegurar que el nombre del repo esté en minúsculas (requisito estricto de Docker)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER:${{ github.sha }} -t ghcr.io/$REPO_LOWER:1.0.0 .
          docker push ghcr.io/$REPO_LOWER:${{ github.sha }}
          docker push ghcr.io/$REPO_LOWER:1.0.0